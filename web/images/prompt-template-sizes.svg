<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 202" width="620" height="202" font-family="Charter, Georgia, serif" role="img" aria-label="Fixed prompt-template size and typical input size of Zeeguu LLM calls at commit c853d76, with each template's first-version size">
<style>
