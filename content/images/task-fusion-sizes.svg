<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 307" width="620" height="307" font-family="Charter, Georgia, serif" role="img" aria-label="Instructions for each task in Zeeguu's article-assessment call at commit c853d76, next to the article all of them read">
