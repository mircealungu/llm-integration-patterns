<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 320" width="514" height="320" font-family="Charter, Georgia, serif" role="img" aria-label="Fixed prompt-template size for fourteen LLM calls in Zeeguu, from 392 to 9,355 characters">
<style>
  .bar  { fill:#2a78d6; }
  .lbl  { font-size:9.5px; fill:#0b0b0b; }
