  .tick { font-size:8.5px; fill:#52514e; }
  .axis { font-size:9px;   fill:#52514e; }
  .grid { stroke:#d8d7d2; stroke-width:0.6; }
  @media (prefers-color-scheme: dark) {
    .bar { fill:#3987e5; } .lbl { fill:#ffffff; }
    .val,.tick,.axis { fill:#c3c2b7; } .grid { stroke:#3a3a38; }
  }
</style>
<line class="grid" x1="168.0" y1="20" x2="168.0" y2="290.0"/>
